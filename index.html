<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロット管理ホーム</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  display: flex;
  height: 100vh;
  background: #f6f7fb;
}

/* 左ペイン */
.left {
  width: 35%;
  background: #fff;
  border-right: 1px solid #ddd;
  padding: 14px;
  overflow: auto;
}

/* 右ペイン（簡易説明） */
.right {
  width: 65%;
  padding: 20px;
  overflow: auto;
}

/* ガイド */
.guide {
  font-size: 12px;
  color: #555;
  background: #eef3ff;
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 12px;
}

/* ボタン */
button {
  padding: 6px 10px;
  margin: 4px 0;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #2b4cff;
  color: white;
}

button:hover {
  background: #1f36cc;
}

/* シリーズカード */
.series {
  border: 1px solid #ddd;
  margin-top: 10px;
  padding: 8px;
  border-radius: 8px;
  background: #fafafa;
}

/* タイトル */
.series-title {
  font-weight: bold;
  color: #2b4cff;
  cursor: pointer;
  margin-bottom: 6px;
}

/* 作品 */
.work {
  margin-left: 12px;
  font-size: 14px;
  padding: 3px;
  cursor: pointer;
  border-left: 3px solid transparent;
}

.work:hover {
  background: #eef2ff;
}

.work:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- 左 -->
<div class="left">

<div class="guide">
<strong>使い方</strong><br>
① シリーズを作る（フォルダ）<br>
② 作品を作る（中身）<br>
③ 作品をクリック → 編集画面へ
</div>

<button onclick="addSeries()">＋シリーズ作成</button>
<button onclick="addWork()">＋作品作成</button>

<div id="list"></div>

</div>

<!-- 右 -->
<div class="right">
  <h2>プロット管理ツール</h2>
  <p>
    この画面は「作品の一覧管理」です。<br>
    編集は作品をクリックすると開きます。
  </p>
</div>

<script>

let data = { series: {} };

load();
render();

/* -----------------------
   シリーズ作成
----------------------- */
function addSeries() {
  const name = prompt("シリーズ名");
  if (!name) return;

  if (!data.series[name]) {
    data.series[name] = { works: {} };
  }

  save();
  render();
}

/* -----------------------
   作品作成
----------------------- */
function addWork() {
  const seriesName = prompt("シリーズ名（空なら単発）") || "単発";
  const title = prompt("作品タイトル");
  if (!title) return;

  if (!data.series[seriesName]) {
    data.series[seriesName] = { works: {} };
  }

  data.series[seriesName].works[title] = {
    title,
    theme: "",
    word: "",
    deadline: "",
    event: { date:"", name:"", place:"", sp:"" },
    memo: "",
    structure: [
      { label: "起", scenes: [] },
      { label: "承", scenes: [] },
      { label: "転", scenes: [] },
      { label: "結", scenes: [] }
    ]
  };

  save();
  render();
}

/* -----------------------
   編集画面へ
----------------------- */
function openWork(series, title) {
  location.href = `edit.html?series=${encodeURIComponent(series)}&work=${encodeURIComponent(title)}`;
}

/* -----------------------
   表示
----------------------- */
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  Object.keys(data.series).forEach(s => {

    const box = document.createElement("div");
    box.className = "series";

    const title = document.createElement("div");
    title.className = "series-title";
    title.textContent = "▼ " + s;

    box.appendChild(title);

    Object.keys(data.series[s].works).forEach(w => {

      const work = document.createElement("div");
      work.className = "work";
      work.textContent = w;

      work.onclick = () => openWork(s, w);

      box.appendChild(work);
    });

    list.appendChild(box);
  });
}

/* -----------------------
   保存
----------------------- */
function save() {
  localStorage.setItem("plotApp", JSON.stringify(data));
}

/* -----------------------
   読み込み
----------------------- */
function load() {
  const saved = localStorage.getItem("plotApp");
  if (saved) {
    data = JSON.parse(saved);
  }
}

</script>

</body>
</html>
