<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロット管理アプリ</title>

<style>
body {
  display: flex;
  font-family: sans-serif;
  height: 100vh;
  margin: 0;
}

/* 左右 */
.left {
  width: 35%;
  border-right: 1px solid #ccc;
  padding: 12px;
  overflow: auto;
}

.right {
  width: 65%;
  padding: 12px;
  overflow: auto;
}

/* ツリー */
.series {
  margin-bottom: 16px;
  border: 1px solid #aaa;
  padding: 6px;
}

.series-title {
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 6px;
}

.work {
  margin-left: 10px;
  cursor: pointer;
  padding: 2px 0;
  font-size: 14px;
}

.work:hover {
  text-decoration: underline;
}

/* ボタン */
button {
  margin-top: 6px;
}

/* 右側 */
.section {
  margin-bottom: 20px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 10px;
}

.scene {
  border: 1px solid #ddd;
  padding: 6px;
  margin: 6px 0;
}

input, textarea {
  width: 100%;
  margin-top: 4px;
}
</style>
</head>

<body>

<!-- 左 -->
<div class="left">
  <h3>シリーズ</h3>
  <div id="seriesList"></div>

  <button onclick="addSeries()">＋シリーズ追加</button>
  <button onclick="addWork()">＋作品追加</button>
</div>

<!-- 右 -->
<div class="right">
  <h2 id="currentTitle">未選択</h2>
  <div id="editor"></div>
</div>

<script>

let data = {
  series: {}
};

let current = {
  series: null,
  work: null
};

// 初期化
load();
renderSeries();
renderEditor();

/* -----------------------
   シリーズ追加
----------------------- */
function addSeries() {
  const name = prompt("シリーズ名");
  if (!name) return;

  if (!data.series[name]) {
    data.series[name] = { works: {} };
  }

  save();
  renderSeries();
}

/* -----------------------
   作品追加
----------------------- */
function addWork() {
  const seriesName = prompt("シリーズ名（空なら単発）");
  const title = prompt("作品タイトル");
  if (!title) return;

  const s = seriesName || "単発";

  if (!data.series[s]) {
    data.series[s] = { works: {} };
  }

  data.series[s].works[title] = {
    title,
    theme: "",
    word: "",
    deadline: "",
    event: { date:"", name:"", place:"", sp:"" },
    memo: "",
    structure: [
      { label: "起", scenes: [] },
      { label: "承", scenes: [] },
      { label: "転", scenes: [] },
      { label: "結", scenes: [] }
    ]
  };

  current.series = s;
  current.work = title;

  save();
  renderSeries();
  renderEditor();
}

/* -----------------------
   作品選択
----------------------- */
function selectWork(series, title) {
  current.series = series;
  current.work = title;
  renderEditor();
}

/* -----------------------
   左側表示
----------------------- */
function renderSeries() {
  const list = document.getElementById("seriesList");
  list.innerHTML = "";

  Object.keys(data.series).forEach(s => {
    const div = document.createElement("div");
    div.className = "series";

    const title = document.createElement("div");
    title.className = "series-title";
    title.textContent = "▼ " + s;

    div.appendChild(title);

    Object.keys(data.series[s].works).forEach(w => {
      const work = document.createElement("div");
      work.className = "work";
      work.textContent = w;

      work.onclick = () => selectWork(s, w);

      div.appendChild(work);
    });

    list.appendChild(div);
  });
}

/* -----------------------
   右側エディタ
----------------------- */
function renderEditor() {
  const ed = document.getElementById("editor");

  if (!current.series || !current.work) {
    document.getElementById("currentTitle").textContent = "未選択";
    ed.innerHTML = "";
    return;
  }

  const work = data.series[current.series].works[current.work];

  document.getElementById("currentTitle").textContent =
    current.series + " / " + current.work;

  ed.innerHTML = `
    <div>
      <input id="theme" placeholder="テーマ" value="${work.theme}">
      <input id="word" placeholder="文字数" value="${work.word}">
      <input id="deadline" placeholder="締切" value="${work.deadline}">
      <textarea id="memo" placeholder="メモ">${work.memo}</textarea>
      <button onclick="saveWork()">保存</button>
    </div>
  `;
}

/* -----------------------
   保存（作品単位）
----------------------- */
function saveWork() {
  const w = data.series[current.series].works[current.work];

  w.theme = document.getElementById("theme").value;
  w.word = document.getElementById("word").value;
  w.deadline = document.getElementById("deadline").value;
  w.memo = document.getElementById("memo").value;

  save();
}

/* -----------------------
   保存全体
----------------------- */
function save() {
  localStorage.setItem("plotApp", JSON.stringify(data));
}

/* -----------------------
   読み込み
----------------------- */
function load() {
  const saved = localStorage.getItem("plotApp");
  if (saved) {
    data = JSON.parse(saved);
  }
}

</script>

</body>
</html>
