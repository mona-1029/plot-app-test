<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロット管理アプリ</title>

<style>
body {
  display: flex;
  margin: 0;
  font-family: sans-serif;
  height: 100vh;
  background: #f6f7fb;
}

/* 左 */
.left {
  width: 35%;
  padding: 14px;
  overflow: auto;
  border-right: 1px solid #ddd;
  background: #ffffff;
}

/* 右 */
.right {
  width: 65%;
  padding: 16px;
  overflow: auto;
}

/* ガイド */
.guide {
  font-size: 12px;
  color: #666;
  margin-bottom: 12px;
  background: #f0f3ff;
  padding: 8px;
  border-radius: 6px;
}

/* シリーズカード */
.series {
  margin-bottom: 12px;
  padding: 8px;
  border-radius: 8px;
  background: #f9f9f9;
  border: 1px solid #ddd;
}

/* シリーズタイトル */
.series-title {
  font-weight: bold;
  cursor: pointer;
  color: #2b4cff;
}

/* 作品 */
.work {
  margin-left: 12px;
  padding: 4px;
  font-size: 14px;
  cursor: pointer;
  border-left: 3px solid transparent;
}

/* hover */
.work:hover {
  background: #eef2ff;
}

/* 選択中 */
.work.active {
  background: #dfe6ff;
  border-left: 3px solid #2b4cff;
}

/* ボタン */
button {
  margin-top: 6px;
  padding: 6px 10px;
  border: none;
  background: #2b4cff;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #1f36cc;
}

/* 右側 */
#currentTitle {
  margin-bottom: 10px;
  padding: 10px;
  background: white;
  border-radius: 8px;
  border: 1px solid #ddd;
}

/* エディタ */
#editor {
  background: white;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

input, textarea {
  width: 100%;
  margin-top: 6px;
  padding: 6px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

textarea {
  min-height: 80px;
}

/* 下部ボタン列 */
.actions {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}
</style>
</head>

<body>

<!-- 左 -->
<div class="left">

<div class="guide">
<strong>使い方</strong><br>
① シリーズ追加 → フォルダ作成<br>
② 作品追加 → 中に保存<br>
③ 作品クリック → 右で編集
</div>

<button onclick="addSeries()">＋シリーズ追加</button>
<button onclick="addWork()">＋作品追加</button>

<div id="seriesList"></div>

</div>

<!-- 右 -->
<div class="right">

<h2 id="currentTitle">未選択</h2>

<div id="editor"></div>

</div>

<script>

let data = { series: {} };

let current = { series: null, work: null };

load();
renderSeries();
renderEditor();

/* シリーズ追加 */
function addSeries() {
  const name = prompt("シリーズ名");
  if (!name) return;

  if (!data.series[name]) {
    data.series[name] = { works: {} };
  }

  save();
  renderSeries();
}

/* 作品追加 */
function addWork() {
  const seriesName = prompt("シリーズ名（空なら単発）") || "単発";
  const title = prompt("作品タイトル");
  if (!title) return;

  if (!data.series[seriesName]) {
    data.series[seriesName] = { works: {} };
  }

  data.series[seriesName].works[title] = {
    title,
    theme: "",
    word: "",
    deadline: "",
    event: {},
    memo: ""
  };

  current.series = seriesName;
  current.work = title;

  save();
  renderSeries();
  renderEditor();
}

/* 作品選択 */
function selectWork(series, title) {
  current.series = series;
  current.work = title;

  renderSeries();
  renderEditor();
}

/* 左表示 */
function renderSeries() {
  const list = document.getElementById("seriesList");
  list.innerHTML = "";

  Object.keys(data.series).forEach(s => {
    const div = document.createElement("div");
    div.className = "series";

    const title = document.createElement("div");
    title.className = "series-title";
    title.textContent = "▼ " + s;

    div.appendChild(title);

    Object.keys(data.series[s].works).forEach(w => {
      const work = document.createElement("div");
      work.className = "work";

      if (current.series === s && current.work === w) {
        work.classList.add("active");
      }

      work.textContent = w;

      work.onclick = () => selectWork(s, w);

      div.appendChild(work);
    });

    list.appendChild(div);
  });
}

/* 右表示 */
function renderEditor() {
  const ed = document.getElementById("editor");

  if (!current.series || !current.work) {
    document.getElementById("currentTitle").textContent = "未選択";
    ed.innerHTML = "";
    return;
  }

  const w = data.series[current.series].works[current.work];

  document.getElementById("currentTitle").textContent =
    current.series + " / " + current.work;

  ed.innerHTML = `
    <label>テーマ</label>
    <input id="theme" value="${w.theme}">

    <label>文字数</label>
    <input id="word" value="${w.word}">

    <label>締切</label>
    <input id="deadline" value="${w.deadline}">

    <label>メモ</label>
    <textarea id="memo">${w.memo}</textarea>

    <div class="actions">
      <button onclick="saveWork()">保存</button>
    </div>
  `;
}

/* 保存 */
function saveWork() {
  const w = data.series[current.series].works[current.work];

  w.theme = document.getElementById("theme").value;
  w.word = document.getElementById("word").value;
  w.deadline = document.getElementById("deadline").value;
  w.memo = document.getElementById("memo").value;

  save();
}

/* 保存全体 */
function save() {
  localStorage.setItem("plotApp", JSON.stringify(data));
}

/* 読み込み */
function load() {
  const saved = localStorage.getItem("plotApp");
  if (saved) data = JSON.parse(saved);
}

</script>

</body>
</html>
