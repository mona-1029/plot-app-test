<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロット管理ホーム</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  display: flex;
  height: 100vh;
  background: #f6f7fb;
}

.left {
  width: 40%;
  background: #fff;
  border-right: 1px solid #ddd;
  padding: 14px;
  overflow: auto;
}

.right {
  width: 60%;
  padding: 20px;
  overflow: auto;
}

button {
  padding: 6px 10px;
  margin: 4px 0;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #2b4cff;
  color: white;
}

button:hover {
  background: #1f36cc;
}

.series {
  border: 1px solid #ddd;
  margin-top: 10px;
  padding: 8px;
  border-radius: 8px;
  background: #fafafa;
}

.series-title {
  font-weight: bold;
  color: #2b4cff;
  cursor: pointer;
  margin-bottom: 6px;
}

.work {
  margin-left: 12px;
  font-size: 14px;
  padding: 3px;
  cursor: pointer;
}

.work:hover {
  background: #eef2ff;
}

.section-title {
  margin-top: 16px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="left">

<h3>作品管理</h3>

<button onclick="addSeries()">＋シリーズ作成</button>
<button onclick="addWork()">＋作品作成</button>

<div id="list"></div>

<h3 class="section-title">ゴミ箱</h3>
<div id="trash"></div>

<button onclick="clearTrash()">ゴミ箱を完全削除</button>

</div>

<div class="right">
  <h2>プロット管理ツール</h2>
  <p>作品をクリックすると編集画面へ移動します</p>
</div>

<script>

let data = { series: {} };

load();
render();

/* ----------------
   シリーズ追加
---------------- */
function addSeries() {
  const name = prompt("シリーズ名");
  if (!name) return;

  if (!data.series[name]) {
    data.series[name] = { works: {} };
  }

  save();
  render();
}

/* ----------------
   作品追加
---------------- */
function addWork() {
  const seriesName = prompt("シリーズ名（空なら単発）") || "単発";
  const title = prompt("作品タイトル");
  if (!title) return;

  if (!data.series[seriesName]) {
    data.series[seriesName] = { works: {} };
  }

  data.series[seriesName].works[title] = {
    data: {
      title,
      theme: "",
      word: "",
      deadline: "",
      memo: "",
      structure: [
        { label: "起", scenes: [] },
        { label: "承", scenes: [] },
        { label: "転", scenes: [] },
        { label: "結", scenes: [] }
      ]
    },
    deleted: false
  };

  save();
  render();
}

/* ----------------
   開く
---------------- */
function openWork(s, w) {
  location.href =
    `edit.html?series=${encodeURIComponent(s)}&work=${encodeURIComponent(w)}`;
}

/* ----------------
   表示
---------------- */
function render() {
  const list = document.getElementById("list");
  const trash = document.getElementById("trash");

  list.innerHTML = "";
  trash.innerHTML = "";

  Object.keys(data.series).forEach(s => {

    const box = document.createElement("div");
    box.className = "series";

    const title = document.createElement("div");
    title.className = "series-title";
    title.textContent = "▼ " + s;

    box.appendChild(title);

    Object.keys(data.series[s].works).forEach(w => {

      const work = data.series[s].works[w];

      const div = document.createElement("div");
      div.className = "work";

      div.textContent = w;

      if (work.deleted) {
        div.style.color = "#999";

        div.onclick = () => {
          const ok = confirm("完全削除しますか？");
          if (!ok) return;

          delete data.series[s].works[w];
          save();
          render();
        };

        trash.appendChild(div);
      } else {
        div.onclick = () => openWork(s, w);
        list.appendChild(div);
      }
    });

    list.appendChild(box);
  });
}

/* ----------------
   ゴミ箱全削除
---------------- */
function clearTrash() {
  const ok = confirm("ゴミ箱を完全に削除しますか？");
  if (!ok) return;

  Object.keys(data.series).forEach(s => {
    const works = data.series[s].works;

    Object.keys(works).forEach(w => {
      if (works[w].deleted) {
        delete works[w];
      }
    });
  });

  save();
  render();
}

/* ----------------
   保存
---------------- */
function save() {
  localStorage.setItem("plotApp", JSON.stringify(data));
}

/* ----------------
   読み込み
---------------- */
function load() {
  const saved = localStorage.getItem("plotApp");
  if (saved) data = JSON.parse(saved);
}

</script>

</body>
</html>
