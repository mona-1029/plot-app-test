<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロットアプリ</title>

<style>
body {
  display: flex;
  font-family: sans-serif;
  height: 100vh;
  margin: 0;
}

/* 左右 */
.left, .right {
  padding: 16px;
  overflow: auto;
}

.left {
  width: 35%;
  border-right: 1px solid #ccc;
}

.right {
  width: 65%;
}

/* ===== 左UI（ノート風） ===== */

.field {
  margin-bottom: 14px;
}

.field-title {
  font-size: 12px;
  margin-bottom: 4px;
  color: #333;
}

/* 枠 */
.field-box {
  border: 1px solid #000;
  padding: 4px;
}

/* 入力 */
.field-box input,
.field-box textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 14px;
  background: transparent;
}

.field-box textarea {
  min-height: 60px;
  resize: vertical;
}

/* イベント行 */
.field-box .row {
  display: flex;
  gap: 6px;
  margin-bottom: 4px;
  font-size: 12px;
}

.field-box .row input {
  flex: 1;
  border: none;
  border-bottom: 1px solid #999;
  outline: none;
}

/* ===== 右プロット ===== */

.section {
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid #ddd;
}

.scene {
  border: 1px solid #ddd;
  padding: 6px;
  margin: 6px 0;
}

button {
  margin-top: 6px;
}
</style>
</head>

<body>

<!-- 左 -->
<div class="left">

<h2>作品情報</h2>

<div class="field">
  <div class="field-title">-- タイトル --</div>
  <div class="field-box">
    <input id="title">
  </div>
</div>

<div class="field">
  <div class="field-title">-- テーマ --</div>
  <div class="field-box">
    <textarea id="theme"></textarea>
  </div>
</div>

<div class="field">
  <div class="field-title">-- 文字数 --</div>
  <div class="field-box">
    <input id="word">
  </div>
</div>

<div class="field">
  <div class="field-title">-- 締切 --</div>
  <div class="field-box">
    <input id="deadline">
  </div>
</div>

<div class="field">
  <div class="field-title">-- イベント --</div>
  <div class="field-box">

    <div class="row">
      日付 <input id="event_date">
    </div>

    <div class="row">
      名称 <input id="event_name">
    </div>

    <div class="row">
      会場 <input id="event_place">
    </div>

    <div class="row">
      SP <input id="event_sp">
    </div>

  </div>
</div>

<div class="field">
  <div class="field-title">-- メモ --</div>
  <div class="field-box">
    <textarea id="memo"></textarea>
  </div>
</div>

<button onclick="save()">保存</button>

</div>

<!-- 右 -->
<div class="right">
  <h2>プロット</h2>
  <div id="plot"></div>
</div>

<script>

let data = {
  title: "",
  theme: "",
  word: "",
  deadline: "",
  event: {
    date: "",
    name: "",
    place: "",
    sp: ""
  },
  memo: "",
  structure: [
    { label: "起", scenes: [] },
    { label: "承", scenes: [] },
    { label: "転", scenes: [] },
    { label: "結", scenes: [] }
  ]
};

load();
render();

/* 保存 */
function save() {
  data.title = document.getElementById("title").value;
  data.theme = document.getElementById("theme").value;
  data.word = document.getElementById("word").value;
  data.deadline = document.getElementById("deadline").value;

  data.event = {
    date: document.getElementById("event_date").value,
    name: document.getElementById("event_name").value,
    place: document.getElementById("event_place").value,
    sp: document.getElementById("event_sp").value
  };

  data.memo = document.getElementById("memo").value;

  localStorage.setItem("plot", JSON.stringify(data));
  alert("保存した");
}

/* 読み込み */
function load() {
  const saved = localStorage.getItem("plot");
  if (saved) {
    data = JSON.parse(saved);
  }

  document.getElementById("title").value = data.title || "";
  document.getElementById("theme").value = data.theme || "";
  document.getElementById("word").value = data.word || "";
  document.getElementById("deadline").value = data.deadline || "";

  document.getElementById("memo").value = data.memo || "";

  document.getElementById("event_date").value = data.event?.date || "";
  document.getElementById("event_name").value = data.event?.name || "";
  document.getElementById("event_place").value = data.event?.place || "";
  document.getElementById("event_sp").value = data.event?.sp || "";
}

/* 描画 */
function render() {
  const plot = document.getElementById("plot");
  plot.innerHTML = "";

  data.structure.forEach((sec, sIndex) => {
    const div = document.createElement("div");
    div.className = "section";

    div.innerHTML = `<h3>${sec.label}</h3>`;

    sec.scenes.forEach((scene, i) => {
      const sc = document.createElement("div");
      sc.className = "scene";

      sc.innerHTML = `
        <input value="${scene.viewpoint}" placeholder="視点"
          onchange="updateScene(${sIndex},${i},'viewpoint',this.value)">
        <input value="${scene.stage}" placeholder="舞台"
          onchange="updateScene(${sIndex},${i},'stage',this.value)">
        <textarea onchange="updateScene(${sIndex},${i},'text',this.value)">${scene.text}</textarea>
      `;

      div.appendChild(sc);
    });

    const btn = document.createElement("button");
    btn.textContent = "＋シーン追加";
    btn.onclick = () => addScene(sIndex);

    div.appendChild(btn);
    plot.appendChild(div);
  });
}

/* シーン追加 */
function addScene(index) {
  data.structure[index].scenes.push({
    viewpoint: "",
    stage: "",
    text: ""
  });
  render();
}

/* 更新 */
function updateScene(sec, i, key, value) {
  data.structure[sec].scenes[i][key] = value;
}

</script>

</body>
</html>
