<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロット編集</title>

<style>
body {
  display: flex;
  margin: 0;
  font-family: sans-serif;
  height: 100vh;
  background: #f6f7fb;
}

/* 左（作品情報） */
.left {
  width: 35%;
  padding: 14px;
  overflow: auto;
  border-right: 1px solid #ddd;
  background: #fff;
}

/* 右（プロット） */
.right {
  width: 65%;
  padding: 16px;
  overflow: auto;
}

/* ノート風フィールド */
.field {
  margin-bottom: 14px;
}

.field-title {
  font-size: 12px;
  margin-bottom: 4px;
  color: #444;
}

.field-box {
  border: 1px solid #000;
  padding: 6px;
}

.field-box input,
.field-box textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 14px;
  background: transparent;
}

.field-box textarea {
  min-height: 80px;
  resize: vertical;
}

/* イベント */
.row {
  display: flex;
  gap: 6px;
  margin-bottom: 4px;
  font-size: 12px;
}

.row input {
  flex: 1;
  border: none;
  border-bottom: 1px solid #aaa;
  outline: none;
}

/* 右プロット */
.section {
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid #ddd;
}

.scene {
  border: 1px solid #ddd;
  padding: 6px;
  margin: 6px 0;
}

button {
  margin-top: 6px;
  padding: 6px 10px;
  border: none;
  background: #2b4cff;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #1f36cc;
}

.topbar {
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
}

.back {
  background: #666;
}
</style>
</head>

<body>

<!-- 左 -->
<div class="left">

<div class="topbar">
  <h3 id="title">編集</h3>
</div>

<div class="field">
  <div class="field-title">-- テーマ --</div>
  <div class="field-box">
    <textarea id="theme"></textarea>
  </div>
</div>

<div class="field">
  <div class="field-title">-- 文字数 --</div>
  <div class="field-box">
    <input id="word">
  </div>
</div>

<div class="field">
  <div class="field-title">-- 締切 --</div>
  <div class="field-box">
    <input id="deadline">
  </div>
</div>

<div class="field">
  <div class="field-title">-- メモ --</div>
  <div class="field-box">
    <textarea id="memo"></textarea>
  </div>
</div>

<button onclick="save()">保存</button>
<button class="back" onclick="goBack()">戻る</button>

</div>

<!-- 右 -->
<div class="right">

<h3>プロット</h3>
<div id="plot"></div>

</div>

<script>

let data;
let seriesName;
let workName;

init();
render();

/* URLから読み込み */
function init() {
  const params = new URLSearchParams(location.search);

  seriesName = params.get("series");
  workName = params.get("work");

  const saved = JSON.parse(localStorage.getItem("plotApp"));

  data = saved;

  const w = data.series[seriesName].works[workName];

  document.getElementById("title").textContent =
    seriesName + " / " + workName;

  document.getElementById("theme").value = w.theme || "";
  document.getElementById("word").value = w.word || "";
  document.getElementById("deadline").value = w.deadline || "";
  document.getElementById("memo").value = w.memo || "";
}

/* 保存 */
function save() {
  const w = data.series[seriesName].works[workName];

  w.theme = document.getElementById("theme").value;
  w.word = document.getElementById("word").value;
  w.deadline = document.getElementById("deadline").value;
  w.memo = document.getElementById("memo").value;

  localStorage.setItem("plotApp", JSON.stringify(data));

  alert("保存した");
}

/* 戻る */
function goBack() {
  location.href = "index.html";
}

/* プロット表示 */
function render() {
  const w = data.series[seriesName].works[workName];
  const plot = document.getElementById("plot");

  plot.innerHTML = "";

  w.structure.forEach((sec, i) => {

    const div = document.createElement("div");
    div.className = "section";

    div.innerHTML = `<h4>${sec.label}</h4>`;

    sec.scenes.forEach((sc, j) => {

      const box = document.createElement("div");
      box.className = "scene";

      box.innerHTML = `
        <input value="${sc.viewpoint || ""}" placeholder="視点"
          onchange="updateScene(${i},${j},'viewpoint',this.value)">
        <input value="${sc.stage || ""}" placeholder="舞台"
          onchange="updateScene(${i},${j},'stage',this.value)">
        <textarea onchange="updateScene(${i},${j},'text',this.value)">${sc.text || ""}</textarea>
      `;

      div.appendChild(box);
    });

    const btn = document.createElement("button");
    btn.textContent = "＋シーン追加";
    btn.onclick = () => addScene(i);

    div.appendChild(btn);
    plot.appendChild(div);
  });
}

/* シーン追加 */
function addScene(i) {
  const w = data.series[seriesName].works[workName];

  w.structure[i].scenes.push({
    viewpoint: "",
    stage: "",
    text: ""
  });

  save();
  render();
}

/* 更新 */
function updateScene(i, j, key, value) {
  const w = data.series[seriesName].works[workName];

  w.structure[i].scenes[j][key] = value;

  save();
}

</script>

</body>
</html>
