<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロット編集</title>

<style>
body {
  display: flex;
  margin: 0;
  font-family: sans-serif;
  height: 100vh;
  background: #f6f7fb;
}

.left {
  width: 35%;
  padding: 14px;
  background: #fff;
  border-right: 1px solid #ddd;
  display: flex;
  flex-direction: column;
  overflow: auto;
}

.right {
  width: 65%;
  padding: 16px;
  overflow: auto;
}

/* タイトルエリア */
.titleBox {
  margin-bottom: 10px;
}

.titleBox input {
  width: 100%;
  padding: 6px;
  font-size: 16px;
  margin-bottom: 6px;
}

/* フィールド */
input, textarea {
  width: 100%;
  margin-bottom: 8px;
  padding: 6px;
}

/* ボタン共通 */
button {
  padding: 6px 10px;
  margin: 4px 0;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: white;
}

/* 通常 */
.btn {
  background: #2b4cff;
}
.btn:hover {
  background: #1f36cc;
}

/* 危険ボタン */
.danger {
  background: #e53935;
}
.danger:hover {
  background: #c62828;
}

/* 下固定エリア */
.bottom {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 10px;
  border-top: 1px solid #ddd;
}

/* プロット */
.scene {
  border: 1px solid #ddd;
  padding: 6px;
  margin: 6px 0;
}
</style>
</head>

<body>

<!-- 左 -->
<div class="left">

<div class="titleBox">
  <input id="title">
</div>

<div>
<input id="theme" placeholder="テーマ">
<input id="word" placeholder="文字数">
<input id="deadline" placeholder="締切">
<textarea id="memo" placeholder="メモ"></textarea>
</div>

<button class="btn" onclick="save()">保存</button>

<!-- 下固定（重要ボタン群） -->
<div class="bottom">

<button class="btn" onclick="rename()">タイトル変更</button>
<button class="danger" onclick="deleteWork()">🗑 ゴミ箱へ移動</button>
<button class="btn" onclick="goBack()">← 戻る</button>

</div>

</div>

<!-- 右 -->
<div class="right">

<h3>プロット</h3>
<div id="plot"></div>

</div>

<script>

let data;
let s, w;

init();
render();

/* ----------------
   初期化
---------------- */
function init() {
  const p = new URLSearchParams(location.search);

  s = p.get("series");
  w = p.get("work");

  data = JSON.parse(localStorage.getItem("plotApp"));

  const work = data.series[s].works[w].data;

  document.getElementById("title").value = w;
  document.getElementById("theme").value = work.theme || "";
  document.getElementById("word").value = work.word || "";
  document.getElementById("deadline").value = work.deadline || "";
  document.getElementById("memo").value = work.memo || "";
}

/* ----------------
   保存
---------------- */
function save() {
  const work = data.series[s].works[w].data;

  work.theme = theme.value;
  work.word = word.value;
  work.deadline = deadline.value;
  work.memo = memo.value;

  localStorage.setItem("plotApp", JSON.stringify(data));
}

/* ----------------
   タイトル変更（確実に反映）
---------------- */
function rename() {
  const newName = title.value.trim();
  if (!newName || newName === w) return;

  const works = data.series[s].works;

  works[newName] = works[w];
  delete works[w];

  w = newName;

  save();
  alert("タイトル変更した");
}

/* ----------------
   ゴミ箱へ移動
---------------- */
function deleteWork() {
  const ok = confirm("この作品をゴミ箱へ移動しますか？");
  if (!ok) return;

  data.series[s].works[w].deleted = true;

  localStorage.setItem("plotApp", JSON.stringify(data));

  location.href = "index.html";
}

/* ----------------
   戻る
---------------- */
function goBack() {
  location.href = "index.html";
}

/* ----------------
   プロット表示
---------------- */
function render() {
  const work = data.series[s].works[w].data;
  const plot = document.getElementById("plot");

  plot.innerHTML = "";

  work.structure.forEach((sec, i) => {

    const div = document.createElement("div");

    div.innerHTML = `<h4>${sec.label}</h4>`;

    sec.scenes.forEach(sc => {
      div.innerHTML += `
        <div class="scene">
          <input placeholder="視点">
          <input placeholder="舞台">
          <textarea placeholder="内容"></textarea>
        </div>
      `;
    });

    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = "＋シーン追加";

    btn.onclick = () => {
      sec.scenes.push({});
      save();
      render();
    };

    div.appendChild(btn);

    plot.appendChild(div);
  });
}

</script>

</body>
</html>
