<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロット編集</title>

<style>
body {
  display: flex;
  margin: 0;
  font-family: sans-serif;
  height: 100vh;
  background: #f6f7fb;
}

.left {
  width: 35%;
  padding: 14px;
  background: #fff;
  border-right: 1px solid #ddd;
  overflow: auto;
}

.right {
  width: 65%;
  padding: 16px;
  overflow: auto;
}

input, textarea {
  width: 100%;
  margin-bottom: 8px;
  padding: 6px;
}

button {
  padding: 6px 10px;
  margin: 4px;
  border: none;
  background: #2b4cff;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #1f36cc;
}

.scene {
  border: 1px solid #ddd;
  padding: 6px;
  margin: 6px 0;
}
</style>
</head>

<body>

<div class="left">

<h3>作品情報</h3>

<input id="title">

<input id="theme" placeholder="テーマ">
<input id="word" placeholder="文字数">
<input id="deadline" placeholder="締切">
<textarea id="memo" placeholder="メモ"></textarea>

<button onclick="rename()">タイトル変更</button>
<button onclick="save()">保存</button>
<button onclick="deleteWork()">ゴミ箱へ</button>
<button onclick="goBack()">戻る</button>

</div>

<div class="right">
<h3>プロット</h3>
<div id="plot"></div>
</div>

<script>

let data;
let s, w;

init();
render();

/* ----------------
   初期化
---------------- */
function init() {
  const p = new URLSearchParams(location.search);
  s = p.get("series");
  w = p.get("work");

  data = JSON.parse(localStorage.getItem("plotApp"));

  const work = data.series[s].works[w].data;

  document.getElementById("title").value = w;
  document.getElementById("theme").value = work.theme || "";
  document.getElementById("word").value = work.word || "";
  document.getElementById("deadline").value = work.deadline || "";
  document.getElementById("memo").value = work.memo || "";
}

/* ----------------
   保存
---------------- */
function save() {
  const work = data.series[s].works[w].data;

  work.theme = theme.value;
  work.word = word.value;
  work.deadline = deadline.value;
  work.memo = memo.value;

  localStorage.setItem("plotApp", JSON.stringify(data));
}

/* ----------------
   タイトル変更
---------------- */
function rename() {
  const newName = title.value;
  if (!newName) return;

  const works = data.series[s].works;

  works[newName] = works[w];
  delete works[w];

  w = newName;

  save();
}

/* ----------------
   ゴミ箱へ
---------------- */
function deleteWork() {
  const ok = confirm("ゴミ箱へ移動しますか？");
  if (!ok) return;

  data.series[s].works[w].deleted = true;

  localStorage.setItem("plotApp", JSON.stringify(data));

  location.href = "index.html";
}

/* ----------------
   戻る
---------------- */
function goBack() {
  location.href = "index.html";
}

/* ----------------
   プロット表示
---------------- */
function render() {
  const work = data.series[s].works[w].data;
  const plot = document.getElementById("plot");

  plot.innerHTML = "";

  work.structure.forEach((sec, i) => {

    const div = document.createElement("div");

    div.innerHTML = `<h4>${sec.label}</h4>`;

    sec.scenes.forEach(sc => {
      div.innerHTML += `
        <div class="scene">
          <input placeholder="視点">
          <input placeholder="舞台">
          <textarea placeholder="内容"></textarea>
        </div>
      `;
    });

    const btn = document.createElement("button");
    btn.textContent = "＋シーン追加";

    btn.onclick = () => {
      sec.scenes.push({});
      save();
      render();
    };

    div.appendChild(btn);

    plot.appendChild(div);
  });
}

</script>

</body>
</html>
