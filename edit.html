<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロット編集</title>

<style>
body {
  display: flex;
  margin: 0;
  font-family: sans-serif;
  height: 100vh;
  background: #f6f7fb;
}

.left {
  width: 35%;
  padding: 14px;
  background: #fff;
  border-right: 1px solid #ddd;
  overflow: auto;
}

.right {
  width: 65%;
  padding: 16px;
  overflow: auto;
}

/* ノート風 */
.field {
  margin-bottom: 12px;
}

label {
  font-size: 12px;
  color: #555;
}

input, textarea {
  width: 100%;
  padding: 6px;
  margin-top: 4px;
  box-sizing: border-box;
}

/* ボタン */
button {
  padding: 6px 10px;
  margin: 4px 0;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: white;
}

.btn {
  background: #2b4cff;
}

.btn:hover {
  background: #1f36cc;
}

.danger {
  background: #e53935;
}

.danger:hover {
  background: #c62828;
}

/* 上部情報エリア */
.topbar {
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid #ddd;
}
</style>
</head>

<body>

<!-- 左 -->
<div class="left">

<div class="topbar">
  <div class="field">
    <label>タイトル</label>
    <input id="title">
  </div>

  <button class="btn" onclick="save()">保存</button>
  <button class="danger" onclick="deleteWork()">ゴミ箱へ移動</button>
</div>

<div class="field">
  <label>テーマ</label>
  <input id="theme">
</div>

<div class="field">
  <label>文字数</label>
  <input id="word">
</div>

<div class="field">
  <label>締切</label>
  <input id="deadline">
</div>

<div class="field">
  <label>メモ</label>
  <textarea id="memo"></textarea>
</div>

<button class="btn" onclick="goBack()">戻る</button>

</div>

<!-- 右 -->
<div class="right">

<h3>プロット</h3>
<div id="plot"></div>

</div>

<script>

let data;
let s, w;

init();
render();

/* ----------------
   初期化
---------------- */
function init() {
  const p = new URLSearchParams(location.search);

  s = p.get("series");
  w = p.get("work");

  data = JSON.parse(localStorage.getItem("plotApp"));

  const work = data.series[s].works[w].data;

  // ←ここが「直感的編集」
  title.value = w;
  theme.value = work.theme || "";
  word.value = work.word || "";
  deadline.value = work.deadline || "";
  memo.value = work.memo || "";
}

/* ----------------
   保存（全部まとめて）
---------------- */
function save() {
  const work = data.series[s].works[w].data;

  work.theme = theme.value;
  work.word = word.value;
  work.deadline = deadline.value;
  work.memo = memo.value;

  /* タイトル変更もここで反映 */
  const newTitle = title.value.trim();

  if (newTitle && newTitle !== w) {
    const works = data.series[s].works;

    works[newTitle] = works[w];
    delete works[w];

    w = newTitle;
  }

  localStorage.setItem("plotApp", JSON.stringify(data));
}

/* ----------------
   ゴミ箱へ
---------------- */
function deleteWork() {
  const ok = confirm("この作品をゴミ箱へ移動しますか？");
  if (!ok) return;

  data.series[s].works[w].deleted = true;

  localStorage.setItem("plotApp", JSON.stringify(data));

  location.href = "index.html";
}

/* ----------------
   戻る
---------------- */
function goBack() {
  location.href = "index.html";
}

/* ----------------
   プロット表示
---------------- */
function render() {
  const work = data.series[s].works[w].data;
  const plot = document.getElementById("plot");

  plot.innerHTML = "";

  work.structure.forEach((sec, i) => {

    const div = document.createElement("div");
    div.innerHTML = `<h4>${sec.label}</h4>`;

    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = "＋シーン追加";

    btn.onclick = () => {
      sec.scenes.push({});
      save();
      render();
    };

    div.appendChild(btn);
    plot.appendChild(div);
  });
}

</script>

</body>
</html>
